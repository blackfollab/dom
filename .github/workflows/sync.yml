name: Crypto address sync

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: crypto-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers (if not cached)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright OS deps (if cached)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Filter disabled domains
        run: |
          node -e "
            const fs = require('fs');
            const domains = JSON.parse(fs.readFileSync('config/domains.json'));
            let disabled = [];
            try { disabled = JSON.parse(fs.readFileSync('config/disabled.json')); } catch {}
            const originalCount = domains.domains.length;
            domains.domains = domains.domains.filter(d => !disabled.includes(d.name));
            fs.writeFileSync('config/domains.json', JSON.stringify(domains, null, 2));
            console.log('Skipped', originalCount - domains.domains.length, 'disabled domains.');
          "

      - name: Restore cookies from secrets
        env:
          COOKIE_BITSCREST_COM:              ${{ secrets.COOKIE_BITSCREST_COM }}
          COOKIE_VENOSMARKET_COM:            ${{ secrets.COOKIE_VENOSMARKET_COM }}
          COOKIE_ACCOUNT_AGENCYBROKER_CA:    ${{ secrets.COOKIE_ACCOUNT_AGENCYBROKER_CA }}
          COOKIE_PARTNER_POWERPIRE_COM:      ${{ secrets.COOKIE_PARTNER_POWERPIRE_COM }}
          COOKIE_ACCOUNT_NOVAGROWTHFUND_COM: ${{ secrets.COOKIE_ACCOUNT_NOVAGROWTHFUND_COM }}
          COOKIE_VORTEXINVESTCAPITAL_ONLINE: ${{ secrets.COOKIE_VORTEXINVESTCAPITAL_ONLINE }}
          COOKIE_CYPX_CAPITAL:               ${{ secrets.COOKIE_CYPX_CAPITAL }}
          COOKIE_NOVIONCAPITAL_APP:          ${{ secrets.COOKIE_NOVIONCAPITAL_APP }}
          COOKIE_VYROTRADER_COM:             ${{ secrets.COOKIE_VYROTRADER_COM }}
          COOKIE_COINMATRFX_COM:             ${{ secrets.COOKIE_COINMATRFX_COM }}
          COOKIE_BLOCKTELLEX_COM:            ${{ secrets.COOKIE_BLOCKTELLEX_COM }}
          COOKIE_VICIREITPROPERTIES_ORG:     ${{ secrets.COOKIE_VICIREITPROPERTIES_ORG }}
          COOKIE_OPULENTDRAGONS_COM:         ${{ secrets.COOKIE_OPULENTDRAGONS_COM }}
        run: node scripts/restore-cookies.mjs

      - name: Run sync
        env:
          HEADLESS: 'true'
          LOGIN_EMAIL:    ${{ secrets.LOGIN_EMAIL }}
          LOGIN_PASSWORD: ${{ secrets.LOGIN_PASSWORD }}
        run: npm run sync

      - name: Upload reports and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sync-output-run-${{ github.run_number }}
          path: |
            state/reports/
            state/screenshots/
          retention-days: 14
          if-no-files-found: ignore

      - name: Publish status report to docs
        if: always()
        run: |
          mkdir -p docs
          if [ -f state/reports/last-run.json ]; then
            cp state/reports/last-run.json docs/last-run.json
          else
            echo '{"timestamp":"'$(date -Iseconds)'","summary":{"total":0,"ok":0,"noop":0,"failed":0},"domains":[]}' > docs/last-run.json
          fi
          
          node -e "
            const fs = require('fs');
            const lastRun = JSON.parse(fs.readFileSync('docs/last-run.json'));
            let status = { lastRun: null, lastSuccess: null, lastFailure: null, events: [], history: [], domainStats: {} };
            
            try { status = JSON.parse(fs.readFileSync('docs/status.json')); } catch (e) {}
            
            const now = lastRun.timestamp;
            const today = new Date().toISOString().split('T')[0];
            
            status.lastRun = now;
            if (lastRun.summary.failed > 0) { status.lastFailure = now; } else { status.lastSuccess = now; }
            
            if (!status.events) status.events = [];
            if (!status.domainStats) status.domainStats = {};
            
            let totalFixesToday = 0;

            lastRun.domains.forEach(d => {
              if (!status.domainStats[d.name]) {
                status.domainStats[d.name] = { totalChanges: 0, lastChanged: null, lastError: null };
              }
              const stats = status.domainStats[d.name];
              
              if (d.status === 'ok' && d.changes && Object.keys(d.changes).length > 0) {
                const fixList = Object.keys(d.changes).join(', ');
                stats.totalChanges += Object.keys(d.changes).length;
                stats.lastChanged = now;
                totalFixesToday++;
                
                const eventExists = status.events.some(e => e.time === now && e.domain === d.name && e.type === 'change');
                if (!eventExists) {
                  status.events.unshift({ time: now, type: 'change', domain: d.name, details: 'Fixed: ' + fixList });
                }
              }
              
              if (d.error) {
                stats.lastError = d.error;
                const eventExists = status.events.some(e => e.time === now && e.domain === d.name && e.type === 'error');
                if (!eventExists) {
                  status.events.unshift({ time: now, type: 'error', domain: d.name, details: d.error });
                }
              }
            });
            
            status.events = status.events.slice(0, 100);
            
            const existingIdx = status.history.findIndex(h => h.date === today);
            const summary = {
              date: today,
              ok: lastRun.summary.ok,
              noop: lastRun.summary.noop,
              failed: lastRun.summary.failed,
              total: lastRun.summary.total,
              fixedCount: totalFixesToday
            };
            
            if (existingIdx > -1) { status.history[existingIdx] = summary; } else { status.history.push(summary); }
            status.history = status.history.slice(-30);
            
            fs.writeFileSync('docs/status.json', JSON.stringify(status, null, 2));
          "

      - name: Commit and push docs
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # 1. Backup the newly generated JSON files
          cp docs/last-run.json /tmp/last-run.json
          cp docs/status.json /tmp/status.json
          
          # 2. Discard any local changes and sync with the absolute latest remote
          git restore config/domains.json
          git fetch origin main
          git reset --hard origin/main
          
          # 3. Restore our new files and commit
          cp /tmp/last-run.json docs/last-run.json
          cp /tmp/status.json docs/status.json
          git add docs/last-run.json docs/status.json
          git diff --cached --quiet || git commit -m "update status report and audit log"
          
          # 4. Push (this will never conflict now)
          git push

      - name: Deploy to GitHub Pages
        if: always()
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy Pages
        if: always()
        id: deployment
        uses: actions/deploy-pages@v4